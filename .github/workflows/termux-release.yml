name: termux-release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  termux-build:
    runs-on: ubuntu-latest
    # Only run on the fork, not if someone syncs this back to the official repo
    if: github.repository_owner != 'router-for-me'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build for Termux aarch64
        run: |
          docker run --rm -v $(pwd):/work -w /work termux/package-builder bash -c "
            apt update && apt install -y golang
            export GOOS=android
            export GOARCH=arm64
            go build -ldflags=\"-s -w -X 'main.Version=${GITHUB_REF_NAME}' -X 'main.Commit=$(git rev-parse --short HEAD)' -X 'main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)'\" -o CLIProxyAPI-termux-aarch64 ./cmd/server
            tar -czf CLIProxyAPI-termux-aarch64.tar.gz CLIProxyAPI-termux-aarch64 LICENSE README.md config.example.yaml
          "

      - name: Upload Termux Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: CLIProxyAPI-termux-aarch64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
