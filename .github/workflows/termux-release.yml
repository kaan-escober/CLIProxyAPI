name: termux-release

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (branch, tag, or sha)'
        required: false

permissions:
  contents: write

jobs:
  termux-build:
    runs-on: ubuntu-latest
    # Only run on the fork, not if someone syncs this back to the official repo
    if: github.repository_owner != 'router-for-me'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
            KIND="tag"
          else
            VERSION="termux-latest"
            KIND="rolling"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "archive=cli-proxy-api_${VERSION}_termux_arm64.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build for Termux aarch64
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags="-s -w -X 'main.Version=${VERSION}' -X 'main.Commit=${COMMIT}' -X 'main.BuildDate=${BUILD_DATE}'" \
            -o cli-proxy-api \
            ./cmd/server
          tar -czf "${{ steps.ver.outputs.archive }}" \
            cli-proxy-api LICENSE README.md config.example.yaml

      # Versioned release for any tag (upstream-synced or manual)
      - name: Upload Termux Asset (tagged release)
        if: steps.ver.outputs.kind == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }} (Termux aarch64)
          files: ${{ steps.ver.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rolling release updated on every main push (incl. fork-sync)
      - name: Upload Termux Asset (rolling latest)
        if: steps.ver.outputs.kind == 'rolling'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: termux-latest
          name: Termux aarch64 (latest)
          body: |
            Rolling build of `main` for Termux aarch64.
            Commit: ${{ github.sha }}
          prerelease: true
          files: ${{ steps.ver.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
